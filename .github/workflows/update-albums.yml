name: Update albums

on:
  schedule:
    # Aja kerran päivässä klo 04:00 UTC (klo 06:00 Suomen aikaa)
    - cron: '0 4 * * *'
  workflow_dispatch:   # Salli manuaalinen käynnistys GitHubista

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch albums and covers
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_ARTIST_ID: ${{ secrets.SPOTIFY_ARTIST_ID }}
          BANDCAMP_ARTIST: ${{ secrets.BANDCAMP_ARTIST }}
        run: python fetch_albums.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add albums.json images/covers/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update albums" && git push)